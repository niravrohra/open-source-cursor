[package]
name = "rursor-sidecar"
version = "0.1.0"
edition = "2021"
description = "Local AI sidecar daemon for Rursor (indexing, context, agent runtime, Gemini Cloud API)"

[dependencies]
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
